<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Visitenkarten – Nutzen A4</title>
  <!--
    Der Nutzen für den Schwarzweiss-Drucker: zehn Karten 85 × 55 mm auf A4, Seite 1 die Vorderseiten, Seite 2 die
    Rückseiten. Der Block steht mittig, darum treffen die Rückseiten beim beidseitigen Druck (wenden an der langen
    Kante) auf die Vorderseiten. Geschnitten wird an den Marken im Rand; auf den Karten selbst steht keine Linie.
    Das Gelb hinter der E-Mail-Adresse fehlt mit Absicht: Es kommt von Hand dazu.
    Als PDF: Chrome ohne Fenster, siehe druck/LIES-MICH.txt. Ausgeliefert wird diese Datei nicht (build.mjs).
  -->
  <style>
    @font-face { font-family: 'Polarstern'; font-weight: 400; src: url('../Polarstern-Regular.ttf') format('truetype'); }
    @font-face { font-family: 'Polarstern'; font-weight: 500; src: url('../Polarstern-Medium.ttf') format('truetype'); }
    @font-face { font-family: 'Polarstern'; font-weight: 600; src: url('../Polarstern-SemiBold.ttf') format('truetype'); }
    @page { size: 210mm 297mm; margin: 0; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #fff; color: #000; font-family: 'Polarstern', sans-serif; }
    .blatt { position: relative; width: 210mm; height: 297mm; overflow: hidden; page-break-after: always; break-after: page; }
    .blatt:last-child { page-break-after: auto; break-after: auto; }
    .nutzen { position: absolute; left: 20mm; top: 11mm; width: 170mm; height: 275mm; display: grid; grid-template-columns: 85mm 85mm; grid-template-rows: repeat(5, 55mm); }
    .karte { width: 85mm; height: 55mm; padding: 7.5mm; display: flex; overflow: hidden; }
    /* Vorderseite — die Masse der Karte auf broda.at, auf 85 mm Breite umgerechnet */
    .vorn { flex-direction: column; justify-content: center; text-align: center; }
    .name { font-weight: 600; font-size: 5.05mm; line-height: 1.2; white-space: nowrap; }
    .titel { font-weight: 400; font-size: 4.49mm; line-height: 1.2; margin-bottom: 6.7mm; }
    .kontakt { font-weight: 500; font-size: 3.74mm; line-height: 1.3; }
    /* Rückseite */
    .hinten { flex-direction: row; justify-content: space-between; align-items: center; font-size: 3.37mm; line-height: 1.6; }
    .hinten .links { width: 45%; text-align: left; font-weight: 500; }
    .hinten .rechts { width: 50%; text-align: right; font-weight: 400; white-space: nowrap; }
    /* Schnittmarken im Rand */
    .marke { position: absolute; background: #000; }
    .marke.s { width: 0.2mm; height: 4mm; }
    .marke.w { width: 4mm; height: 0.2mm; }
  </style>
</head>
<body>
<script>
  const vorn = '<div class="karte vorn"><div class="name">H<span style="margin-left:0.1em">U</span>M<span style="margin-left:-0.06em">A</span>N-CENTERED DESIGN</div><div class="titel">Operating Systems / ML</div><div class="kontakt">kontakt@broda.at</div></div>';
  const hinten = '<div class="karte hinten"><div class="links">Vector Thinking<br>UI/UX Structuring<br>CAD Modelling<br>Digital Fabrication<br>Granite Processing</div><div class="rechts">Dietmar Broda<br>Weigelsdorf 26<br>4115 Kleinzell i.M.<br>Austria<br>+43 681 1038 3810</div></div>';
  // Marken: an jeder Schnittlinie eine oben und unten, eine links und rechts, 2 mm vom Block entfernt
  let marken = '';
  for (const x of [20, 105, 190]) marken += `<div class="marke s" style="left:${x - 0.1}mm;top:5mm"></div><div class="marke s" style="left:${x - 0.1}mm;top:288mm"></div>`;
  for (const y of [11, 66, 121, 176, 231, 286]) marken += `<div class="marke w" style="top:${y - 0.1}mm;left:14mm"></div><div class="marke w" style="top:${y - 0.1}mm;left:192mm"></div>`;
  for (const karte of [vorn, hinten]) document.body.insertAdjacentHTML('beforeend', `<div class="blatt">${marken}<div class="nutzen">${karte.repeat(10)}</div></div>`);
</script>
</body>
</html>
