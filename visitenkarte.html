
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="format-detection" content="telephone=no">
  <title>Visitenkarte – broda.at</title>
  <style>
    @font-face { font-family: 'Polarstern'; font-weight: 400; font-style: normal; src: url('Polarstern-Regular.ttf') format('truetype'); }
    @font-face { font-family: 'Polarstern'; font-weight: 500; font-style: normal; src: url('Polarstern-Medium.ttf') format('truetype'); }
    @font-face { font-family: 'Polarstern'; font-weight: 600; font-style: normal; src: url('Polarstern-SemiBold.ttf') format('truetype'); }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: 'Polarstern', system-ui, sans-serif;
	  font-size: 19.8px;
      background: transparent;
    }

    .scene {
      width: 100%;
      height: 100%;
      perspective: 1000px;
      display: flex;
      align-items: center;
      justify-content: center;
	  overflow: visible;
    }

    .karte {
      aspect-ratio: 5 / 3.4; /* Oder 16 / 9, 4 / 3 etc. */
      width: 90%;
      height: auto;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.8s ease;
      cursor: pointer;
      border-radius: 8px;
      box-shadow: 0 0px 20px rgba(0, 0, 0, 0.2);
    }
    .karte:hover .seite {
      box-shadow: 0 8px 10px 0 rgba(31,38,135,0.18);
      border: 1.5px solid rgba(255,255,255,0.55);
    }
    .karte.is-flipped {
      transform: rotateY(180deg);
    }

    .seite {
  position: absolute;
  width: 100%;
  height: 100%;
  border-radius: 8px;
  /* Glass-Effekt: leicht transparent und mit Blur */
  background: rgba(255,255,255,0.36);
  padding: 2em;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  justify-content: center;
  backface-visibility: hidden;
  box-shadow: 0 4px 32px 0 rgba(31,38,135,0.11), 0 2px 8px 0 rgba(60,132,206,0.10);
  border: 1.5px solid rgba(255,255,255,0.37);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  transition: box-shadow 0.3s, border 0.3s;
}

    .vorderseite {
      z-index: 2;
    }

    .rueckseite {
      transform: rotateY(180deg);
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      font-size: clamp(0.9em, 1.5vw, 1.1em);
    }

    /* Die Bildmarke sitzt über der Schrift; sie ist das einzige Schwere auf der Karte. */
    .bildmarke {
      display: block;
      width: 2.9em;
      height: auto;
      margin: 0 auto 0.85em;
    }

    .name {
      font-family: 'Polarstern', system-ui, sans-serif;
      /* Klein geschrieben geht nur bis 500: Der fette Schnitt (600) hat nur Grossbuchstaben. */
      font-weight: 500;
      font-size: 1.44em;
      white-space: nowrap;
      margin-bottom: 0.0em;
      text-align: center;
    }

    .titel {    
      font-size: 1.3em;
      margin-bottom: 1.0em;
      text-align: center;
    }

    .kontakt {
      font-size: clamp(1em, 2vw, 1.3em);
      color: #444;
      line-height: 1.3;
      text-align: center;
    }

    .kontakt a {
      color: #ffa366;
      text-decoration: none;
      font-weight: 400;
      display: inline-block;
      transition: transform 0.2s ease;
    }

    /* Das @ steht frei: vor und nach ihm etwas Luft. */
    .kontakt a .at {
      margin: 0 0.12em;
    }

    /* Nur der Name der Adresse ist fester gesetzt. */
    .kontakt a .fest {
      font-weight: 500;
    }

    .kontakt a:hover {
      transform: scale(1.08);
    }

    .spalte {
      width: 45%;
      line-height: 1.6;
      color: #333;
    }

    .spalte.links {
      text-align: left;
      font-weight: 500;
    }

    .spalte.rechts {
      text-align: right;
    }
	.marker {
  display: inline-block;
  position: relative;
}

.marker::before {
  content: '';
  position: absolute;
  left: -5%;   /* 5% breiter links */
  right: -5%;  /* 5% breiter rechts = 10% breiter insgesamt */
  top: 10%;    /* leicht zentrieren, optisch ggf. feinjustieren */
  bottom: 10%;
  background: linear-gradient(90deg, rgba(255,255,100,0.78) 85%, rgba(255,255,100,0.50) 100%);
  border-radius: 0.22em;
  filter: blur(0.2px);
  z-index: 0;
  pointer-events: none;
  transform: rotate(-3deg); /* gegen Uhrzeigersinn */
}

.marker a {
  position: relative;
  z-index: 1;
  color: #111 !important; /* jetzt schwarz */
}

.domain {
  color: #111;
  font-weight: 500;
  margin-top: 0.12em;
}
  </style>
</head>
<body>
  <div class="scene" onclick="document.querySelector('.karte').classList.toggle('is-flipped')">
    <div class="karte">
      <div class="seite vorderseite">
        <svg class="bildmarke" xmlns="http://www.w3.org/2000/svg" viewBox="4 3 16 16.6" aria-hidden="true"><path fill="#000" d="M4.689,17.189l-.108-6.447c-.008-.456.198-.887.551-1.153l6.353-4.781c.22-.166.528-.087.652.166l2.084,4.268c.108.221.032.493-.173.617l-5.202,3.149c-.16.097-.245.289-.215.48.03.178.154.321.318.368.043.017.089.026.136.028l4.934.945c.212.041.365.236.364.462l-.027,3.973c-.002.297-.265.517-.54.452l-8.78-2.081c-.199-.047-.342-.232-.346-.447ZM15.262,15.148l-.024,3.466c-.003.41.442.647.754.401l3.043-2.391c.11-.087.179-.22.188-.365l.194-3.054c.014-.228-.21-.387-.405-.287l-3.485,1.786c-.161.083-.264.254-.265.443ZM13.037,4.793l2.049,4.195c.076.155.247.23.405.178l3.151-1.048c.2-.066.295-.305.201-.502l-1.501-3.128c-.058-.12-.174-.196-.302-.196l-3.699-.019c-.255-.001-.421.282-.304.521Z"/></svg>
        <div class="name">Reflective Operating Systems</div>
        <div class="titel">human-centered design</div>
        <div class="kontakt">
  <span class="marker">
    <a href="#" style="color:#111;" onclick="event.stopPropagation(); parent.postMessage({ type: 'openForm' }, '*')">
      kontakt<span class="at">@</span><span class="fest">broda.at</span>
    </a>
  </span>
</div>
      </div>
      <div class="seite rueckseite">
        <div class="spalte links">
          Vector Thinking<br>
         UI/UX Structuring<br>
          CAD Modelling<br>
		  Digital Fabrication<br>
          Granite Processing
        </div>
        <div class="spalte rechts">
		  Dietmar Broda<br>
          Weigelsdorf 26<br>
          4115 Kleinzell i.M.<br>
          Austria<br>
          <a href="tel:+4368110383810" style="color:inherit;text-decoration:none">+43 681 1038 3810</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
