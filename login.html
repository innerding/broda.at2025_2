<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <style>
  html, body {
    margin: 0;
    padding: 0;
    background: rgba(0,0,0,0.5);
    color: white;
    font-family: sans-serif;
    height: 100%;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(16px, 2vw, 22px);
  }

  .login-box {
    background: rgba(34, 34, 34, 0.85); /* halbtransparentes Dunkelgrau */
    padding: 2.5em;
    border-radius: 12px;
    width: clamp(300px, 40vw, 480px);
    max-width: 90vw;
    box-shadow: 0 0px 30px rgba(0,0,0,0.5);
    text-align: center;
    backdrop-filter: blur(4px); /* optional: weicher Unschärfeeffekt */
  }

  input {
    width: 100%;
    margin-bottom: 1em;
    padding: 0.8em;
    border: none;
    border-radius: 6px;
    font-size: 1em;
  }

  button {
    padding: 0.7em 1.4em;
    border: none;
    border-radius: 6px;
    background: #f90;
    color: black;
    cursor: pointer;
    font-size: 1em;
  }

  #loginError {
    display: none;
    color: red;
    margin-top: 1em;
  }

  #successScreen {
    display: none;
    position: fixed;
    inset: 0;
    background-color: rgba(0, 123, 255, 0.85);
    color: white;
    font-size: 2em;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
  }
</style>
</head>
<body>
  <div class="login-box">
    <h2>Mappe</h2>
    <label for="password">Schlüssel:</label><br>
    <input type="password" id="password" autocomplete="off"><br>
    <button id="loginButton">Öffnen</button>
    <p id="loginError">Dieser Schlüssel passt nicht</p>
  </div>

  <div id="successScreen">Takt</div>

  <script>
    // Die Prüfung liegt beim Worker (/api/tuer). Hier steht kein Schlüssel —
    // was im Browser steht, kann jeder lesen.
    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('successScreen').style.display = 'none';
      document.querySelector('.login-box').style.display = 'block';
    });

    async function oeffnen() {
      const wort = document.getElementById('password').value.trim();
      if (!wort) return;
      try {
        const antwort = await fetch('/api/tuer?k=' + encodeURIComponent(wort));
        if (antwort.ok) {
          document.querySelector('.login-box').style.display = 'none';
          document.getElementById('successScreen').style.display = 'flex';
          window.parent.postMessage({ status: "success" }, "*");
          location.href = '/mappe?k=' + encodeURIComponent(wort);
          return;
        }
      } catch (e) { /* keine Verbindung — wie ein falscher Schlüssel behandeln */ }
      document.getElementById('loginError').style.display = 'block';
      window.parent.postMessage({ status: "error" }, "*");
    }

    document.getElementById('loginButton').addEventListener('click', (e) => { e.preventDefault(); oeffnen(); });
    document.getElementById('password').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); oeffnen(); } });
  </script>
</body>
</html>
